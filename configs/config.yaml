# Единый конфиг проекта: всё, что в ноутбуке было зашито в код ячеек.

data:
  # Локальный путь или URL (pd.read_csv понимает оба).
  # Датасет: https://www.kaggle.com/competitions/playground-series-s4e1/data
  train_path: data/raw/train.csv
  target: Exited
  test_size: 0.2
  random_state: 42

features:
  # Технические идентификаторы и ПДн — удаляются всегда.
  drop: [id, CustomerId, Surname]
  # Малоинформативные по SHAP / feature_importances (см. ноутбук, раздел
  # «Попробуем убрать малоинформативные фичи»).
  low_importance: [HasCrCard, EstimatedSalary, Tenure]
  categorical: [Geography, Gender]
  numeric: [CreditScore, Age, Tenure, Balance, EstimatedSalary, NumOfProducts]

cv:
  n_splits: 3
  shuffle: true
  random_state: 52
  # Ключевая метрика — recall: важно найти как можно больше отточников.
  refit_metric: recall

# Кандидаты для отбора (`churn select`): GridSearchCV по каждому.
selection:
  logreg:
    poly_features__degree: [1, 2]
    classifier__C: [0.001, 0.01, 0.1, 1]
    classifier__penalty: [elasticnet]
    classifier__solver: [saga]
    classifier__l1_ratio: [0, 0.25, 0.5, 0.75, 1]
    classifier__class_weight: [balanced, null]
  decision_tree:
    classifier__max_depth: [3, 5, 7, 10, 20]
    classifier__min_samples_split: [2, 5, 10, 20]
    classifier__min_samples_leaf: [1, 2, 5, 10]
    classifier__class_weight: [balanced, null]
  random_forest:
    classifier__n_estimators: [100, 200, 500]
    classifier__max_depth: [3, 5, 7]
    classifier__min_samples_split: [2, 4, 10]
    classifier__min_samples_leaf: [1, 2, 5]
    classifier__class_weight: [balanced]
  catboost:
    classifier__iterations: [100, 200, 500]
    classifier__depth: [3, 5, 7]
    classifier__l2_leaf_reg: [3, 5, 7]
    classifier__auto_class_weights: [Balanced, SqrtBalanced]

# Финальная модель (`churn train`): CatBoost + Optuna.
tuning:
  model: catboost
  n_trials: 10
  random_state: 42
  search_space:
    classifier__iterations: {type: int, low: 100, high: 1000, step: 100}
    classifier__depth: {type: int, low: 4, high: 12, step: 2}
    classifier__l2_leaf_reg: {type: int, low: 2, high: 10, step: 2}
    classifier__auto_class_weights: {type: categorical, choices: [Balanced, SqrtBalanced]}

artifacts:
  model_path: models/model.joblib
  metrics_path: reports/metrics.json
  selection_path: reports/model_selection.csv

n_jobs: -1
