[project]
name = "churn"
version = "0.1.0"
description = "Bank customer churn prediction (Kaggle Playground S4E1): production-ready training & inference pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy (>=1.26,<3.0)",
    "pandas (>=2.1,<3.0)",
    "scikit-learn (>=1.4,<1.8)",
    "catboost (>=1.2,<2.0)",
    "optuna (>=4.0,<5.0)",
    "optuna-integration[sklearn] (>=4.0,<5.0)",
    "pyyaml (>=6.0,<7.0)",
    "joblib (>=1.3,<2.0)",
]

[project.scripts]
churn = "churn.cli:main"

[tool.poetry]
packages = [{ include = "churn", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^5.0"
black = "^24.8"
isort = "^5.13"
flake8 = "^7.1"
flake8-bugbear = "^24.8"
mypy = "^1.11"
types-pyyaml = "^6.0"
pandas-stubs = "^2.2"
pre-commit = "^3.8"

[tool.poetry.group.eda]
optional = true

[tool.poetry.group.eda.dependencies]
jupyter = "^1.0"
matplotlib = "^3.8"
seaborn = "^0.13"
phik = "^0.12"
shap = "^0.46"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

# ---------------------------------------------------------------- tooling ---

[tool.black]
line-length = 99
target-version = ["py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 99
known_first_party = ["churn"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=churn --cov-report=term-missing"
filterwarnings = ["ignore::optuna.exceptions.ExperimentalWarning"]
